# Pinned so CI matches the rustc that this repo's gavmo.nix gets from nixpkgs;
# a newer stable can add clippy lints that fail CI's `-D warnings`. Bump
# deliberately, together with any lint fixes.
#
# musl: the release tarball's static daemon (scripts/build-release-tarball.sh).
[toolchain]
channel = "1.98.1"
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"]
components = ["clippy", "rustfmt"]
