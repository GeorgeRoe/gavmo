[package]
name = "secrets"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"

# Host OS credential store. The platform-native backend features are internally
# gated on `target_os`, so enabling all of them here is safe cross-platform —
# each only pulls deps on its matching target (see keyring's docs).
#
# NOTE (v1, security deferred — see gavmo-tools-config-plan.md §13a): this is the
# simple "one entry per secret" backend. The encrypted Option-B vault lands later
# as another `SecretStore` impl behind this same trait, with no caller changes.
#
# The Linux backend is `async-secret-service` (pure-Rust zbus), NOT
# `sync-secret-service` — the latter links `libdbus-sys` (a C library), which
# breaks a from-source build anywhere `dbus-1` dev headers aren't installed
# (e.g. our workbench/CI). `crypto-rust` keeps encryption pure-Rust too (no
# OpenSSL).
#
# The runtime feature is `async-io`, NOT `tokio`. keyring's sync `Entry` API
# bridges to async D-Bus via zbus's `block_on`; with `zbus/tokio` that is
# `Handle::current().block_on(..)`, which PANICS ("cannot start a runtime from
# within a runtime") whenever it's called from inside our tokio runtime — i.e.
# from every server fn, the boot task, and the MCP ToolExecutor. `zbus/async-io`
# uses `async_io::block_on`, which runs its own executor on the calling thread
# and never panics regardless of a surrounding tokio runtime. (Callers still wrap
# these in `spawn_blocking` so the blocking D-Bus/keyring-unlock call can't stall
# an async worker — see `registry::AppState`'s secret helpers.)
#
# `windows-native`/`apple-native` are internally `target_os`-gated, so listing
# them here is cross-platform-safe (and the `async-io` feature is a no-op on
# Windows/macOS, which don't pull zbus).
keyring = { version = "3", features = [
    "async-secret-service",
    "crypto-rust",
    "async-io",
    "windows-native",
    "apple-native",
] }
