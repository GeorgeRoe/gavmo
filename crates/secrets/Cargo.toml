[package]
name = "secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# AEAD for the vault file. Pure Rust; the 24-byte nonce is safe to generate
# randomly per write. Pinned exactly: crypto bumps must be deliberate.
chacha20poly1305 = "=0.11.0"
# The vault's data key is stored base64-encoded (keyring values are strings).
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
# Wipes the data key and decrypted secrets from memory when dropped.
zeroize = "1"
# Uniquely named, O_EXCL, 0600-at-creation temp files for atomic vault writes.
tempfile.workspace = true

# Hold the vault's data key in the Secret Service (the daemon is Linux-only).
# keyring-core plus the one store used, as keyring 4 recommends over the
# all-in-one `keyring` crate. Finds keys written by keyring 3: it searches
# on `service` + `username` only, which keyring 3's items also carry.
keyring-core = "1"
# zbus: pure Rust, no C libdbus. `rt-async-io`, not tokio: zbus's tokio
# `block_on` panics inside a tokio runtime. Rust crypto for the DH session.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[features]
# Exposes `MemoryStore`, an unencrypted in-process store for other crates'
# tests. Never enable outside dev-dependencies.
test-util = []
