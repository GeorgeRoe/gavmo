[package]
name = "secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# AEAD for the vault file. Pure Rust; the 24-byte nonce is safe to generate
# randomly per write. Pinned exactly: crypto bumps must be deliberate.
chacha20poly1305 = "=0.11.0"
# The vault's data key is stored base64-encoded (keyring values are strings).
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
# Uniquely named, O_EXCL, 0600-at-creation temp files for atomic vault writes.
tempfile.workspace = true

# Holds the vault's data key. Platform backends are `target_os`-gated internally.
# `async-secret-service`, not `sync-secret-service`: avoids linking C libdbus.
# `async-io`, not `tokio`: zbus's tokio `block_on` panics inside a tokio runtime.
keyring = { version = "3", features = [
    "async-secret-service",
    "crypto-rust",
    "async-io",
    "windows-native",
    "apple-native",
] }
