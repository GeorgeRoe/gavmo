[package]
name = "gavmo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
serde = { version = "1", features = ["derive"] }

# ssr-only (native server build) dependencies. None of these may ever be
# pulled into the wasm32 hydrate build.
axum = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "sync", "macros"], optional = true }
serde_json = { version = "1", optional = true }
dirs = { version = "6", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
vm = { path = "../vm", optional = true }
mcp = { path = "../mcp", optional = true }
secrets = { path = "../secrets", optional = true }
toolspec = { path = "../toolspec", optional = true }
# Host-side HTTP forwarder. rustls (not native-tls) avoids an OpenSSL
# build/system dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# hydrate-only (wasm32 browser build) dependencies.
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Calls `document.startViewTransition` via `js_sys::Reflect`; dynamic lookup
# avoids needing `--cfg=web_sys_unstable_apis` for a typed web-sys binding.
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Enabled for both ssr and hydrate: shared view code names `web_sys` types
# (e.g. `MouseEvent`) in signatures. Bindings stub out on non-wasm32; the
# actual DOM calls are hydrate-gated.
web-sys = { version = "0.3", optional = true, features = ["HtmlElement", "CssStyleDeclaration", "Element"] }

[dev-dependencies]
# `ServiceExt::oneshot` for auth router tests. Already a transitive dep of
# axum; this only enables the `util` feature.
tower = { version = "0.5", features = ["util"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:serde_json",
    "dep:dirs",
    "dep:uuid",
    "dep:vm",
    "dep:mcp",
    "dep:secrets",
    "dep:toolspec",
    "dep:reqwest",
    "dep:web-sys",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_axum/default",
]

[package.metadata.leptos]
output-name = "gavmo"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
