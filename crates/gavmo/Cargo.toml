[package]
name = "gavmo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
serde = { version = "1", features = ["derive"] }

# ssr-only (native server build) dependencies. None of these must ever be
# pulled into the wasm32 hydrate build — see crates/gavmo/plan.md §5.
axum = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "sync", "macros"], optional = true }
serde_json = { version = "1", optional = true }
dirs = { version = "6", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
vm = { path = "../vm", optional = true }

# hydrate-only (wasm32 browser build) dependencies.
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Used to drive the View Transitions API (card -> modal morph) by calling
# `document.startViewTransition` dynamically via `js_sys::Reflect` — see
# `app.rs`'s `start_view_transition`. Dynamic lookup (rather than a typed
# web-sys binding) avoids needing `--cfg=web_sys_unstable_apis` at all;
# `leptos_router` itself uses the same trick for its own route transitions.
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Used in `app.rs`'s *shared* (both-target) view code for one specific
# reason: `WorkspaceCard`'s `on:click` handler's event parameter type is
# `web_sys::MouseEvent` regardless of target (that's just what Leptos's
# `on:click` always gives you - see `tachys::html::event`'s `EventDescriptor`
# impl for `click`), so naming it in a function signature compiled for both
# `ssr`/`hydrate` needs `web-sys` available either way. This is safe: like
# `wasm-bindgen`/`js-sys`, `web-sys`'s generated bindings are cross-target by
# design (stub bodies on non-wasm32) - `leptos`'s own `tachys` already pulls
# it in unconditionally for exactly this reason. The actual DOM calls
# (`app.rs`'s `click_target`/`set_card_vt_name`) are still `hydrate`-gated
# internally; nothing here ever runs on the server (there's no click event
# loop in SSR to begin with).
web-sys = { version = "0.3", optional = true, features = ["HtmlElement", "CssStyleDeclaration"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:serde_json",
    "dep:dirs",
    "dep:uuid",
    "dep:vm",
    "dep:web-sys",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_axum/default",
]

[package.metadata.leptos]
output-name = "gavmo"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
