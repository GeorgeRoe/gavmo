[package]
name = "gavmo"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
serde.workspace = true
thiserror.workspace = true

# ssr-only (native server build) dependencies. None of these may ever be
# pulled into the wasm32 hydrate build.
axum = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "sync", "macros", "signal"], optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Error reporting for the daemon binary's startup path.
anyhow = { version = "1", optional = true }
dirs = { version = "6", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# Fixed-length, filesystem-safe per-workspace directory names.
sha2 = { version = "0.10", optional = true }
# O_NOFOLLOW / O_NONBLOCK values for reading guest-writable files safely.
libc = { version = "0.2", optional = true }
# Atomic, owner-only registry writes.
tempfile = { workspace = true, optional = true }
vm = { workspace = true, optional = true }
mcp = { workspace = true, optional = true }
secrets = { workspace = true, optional = true }
toolspec = { workspace = true, optional = true }
# Host-side HTTP forwarder. rustls (not native-tls) avoids an OpenSSL
# build/system dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# hydrate-only (wasm32 browser build) dependencies.
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Calls `document.startViewTransition` via `js_sys::Reflect`; dynamic lookup
# avoids needing `--cfg=web_sys_unstable_apis` for a typed web-sys binding.
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Enabled for both ssr and hydrate: shared view code names `web_sys` types
# (e.g. `MouseEvent`) in signatures. Bindings stub out on non-wasm32; the
# actual DOM calls are hydrate-gated. List every type the code names: relying
# on another crate (leptos) to enable a feature transitively is fragile.
web-sys = { version = "0.3", optional = true, features = [
    "CssStyleDeclaration",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "MouseEvent",
] }

[dev-dependencies]
# `ServiceExt::oneshot` for auth router tests. Already a transitive dep of
# axum; this only enables the `util` feature.
tower = { workspace = true, features = ["util"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:dirs",
    "dep:uuid",
    "dep:sha2",
    "dep:libc",
    "dep:tempfile",
    "dep:vm",
    "dep:mcp",
    "dep:secrets",
    "dep:toolspec",
    "dep:reqwest",
    "dep:web-sys",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_axum/default",
]

[package.metadata.leptos]
output-name = "gavmo"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
