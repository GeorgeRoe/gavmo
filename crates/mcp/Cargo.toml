[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pinned exactly: rmcp's HTTP-transport API shifts between releases, so bump
# deliberately and re-verify `ServerHandler`/`StreamableHttpService` usage.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
http = "1"
serde_json = "1"
