[package]
name = "mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned exactly: rmcp's HTTP-transport API shifts between releases, so bump
# deliberately and re-verify `ServerHandler`/`StreamableHttpService` usage.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
http.workspace = true
serde_json.workspace = true
# The bearer-token gate in front of rmcp's service (same types rmcp uses).
tower-service = "0.3"
bytes = "1"
http-body-util = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }
