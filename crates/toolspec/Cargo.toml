[package]
name = "toolspec"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Maintenance-only upstream but fine for our schema; `serde_yaml_ng` is a
# drop-in fork if it ever needs replacing.
serde_yaml = "0.9"
thiserror = "2"
# Spec-compliant parsing for host-lock checks; string prefixing is bypassable.
url = "2"
