# Mirrors the "Lints and builds" checks in TESTING.md, plus coverage. The
# #[ignore] real-qemu tests run only in the coverage job; the full-boot test
# is left out (it needs a built base image). cargo-deny runs separately, in
# deny.yml.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with the cargo-llvm-cov that gavmo.nix gets from nixpkgs.
  CARGO_LLVM_COV_VERSION: "0.9.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the toolchain, targets and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `-D warnings`: the workspace lints are `warn` level; CI makes them gate.
      - run: cargo clippy --workspace --exclude gavmo --all-targets -- -D warnings
      - run: cargo clippy -p gavmo --features ssr --all-targets -- -D warnings
      - run: cargo clippy -p gavmo --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p gavmo --lib --tests --features hydrate --target wasm32-unknown-unknown -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --exclude gavmo
      - run: cargo test -p gavmo --features ssr

  # The native tests again, instrumented, plus the #[ignore]d real-qemu ones
  # (only the full-boot test is skipped: it needs a built base image). Fails
  # below the floor in the last step; see "Coverage" in TESTING.md. The
  # browser tests aren't measured: llvm-cov can't instrument wasm on stable.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # llvm-cov and llvm-profdata matching the pinned rustc's LLVM.
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      # /dev/kvm is root-only until a udev rule opens it up.
      - name: Install qemu, enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Ubuntu's virtiofsd predates 1.13 (no --translate-uid or --readonly),
      # so take it from the nixpkgs that nix/base/flake.lock pins: the same
      # build the VM image ships, fetched from the binary cache.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Install virtiofsd from the base image's nixpkgs
        run: |
          rev=$(jq -er '.nodes.nixpkgs.locked.rev' nix/base/flake.lock)
          out=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/$rev#virtiofsd")
          echo "$out/bin" >> "$GITHUB_PATH"
          "$out/bin/virtiofsd" --version
      - run: cargo llvm-cov --no-report --workspace --exclude gavmo -- --include-ignored
      - run: cargo llvm-cov --no-report -p gavmo --features ssr -- --include-ignored --skip a_real_vm
      # A ratchet just under the current coverage: raise it as tests are
      # added, never lower it to make a change pass (see TESTING.md).
      - run: cargo llvm-cov report --summary-only --fail-under-regions 90 --fail-under-lines 91
      # Uploaded even when the floor fails: it shows which lines are missed.
      - if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: ignore

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The CLI must match `wasm-bindgen` in Cargo.lock exactly (see gavmo.nix).
      - name: Read wasm-bindgen version from Cargo.lock
        run: |
          v=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          test -n "$v" || { echo "::error::wasm-bindgen not found in Cargo.lock"; exit 1; }
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      # Provides `wasm-bindgen-test-runner`, the wasm32 runner set in
      # .cargo/config.toml.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      # Firefox and geckodriver come preinstalled on GitHub's Ubuntu images.
      - name: Check browser tooling
        run: |
          firefox --version
          geckodriver --version
      - run: cargo test -p gavmo --lib --features hydrate --target wasm32-unknown-unknown

  leptos-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read wasm-bindgen version from Cargo.lock
        run: |
          v=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          test -n "$v" || { echo "::error::wasm-bindgen not found in Cargo.lock"; exit 1; }
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }},cargo-leptos
      - run: cargo leptos build
