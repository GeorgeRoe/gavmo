# Builds the flake's from-source package (daemon, Bifrost, base image, the
# qemu/virtiofsd wrapper) in Nix's sandbox and smoke-tests the result: the
# path a user on an unreleased commit, or `nix build .#gavmo-from-source`,
# takes. release.yml publishes the prebuilt equivalent.
name: Nix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The image build (opencode from source, a NixOS closure, a qcow2) needs
      # more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The disk image is assembled in a VM. Opened before Nix is installed,
      # so the daemon detects the `kvm` system feature.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix flake check
      - name: Build gavmo from source
        run: nix build -L .#gavmo-from-source
      - name: Smoke-test the package
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          scripts/smoke-test-package.sh result/bin/gavmo "$version"
