# cargo-deny: supply-chain checks over every crate in Cargo.lock. Run with
# `cargo deny check` (CI runs it with `-D warnings`, so stale exceptions fail
# too). Policy: everything is denied unless listed here, and every exception
# says why. When an exception stops matching, delete it.

[graph]
# Linux x86-64 daemon plus the wasm32 control-panel bundle; nothing else ships.
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = true

# --- Advisories (RustSec) ---------------------------------------------------
# Every vulnerability is an error regardless of configuration.
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Unmaintained crates with no maintained release to move to. [bans] below
# limits which crates may depend on each, so nothing new can pull them in.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time macro helper used by Leptos; no runtime code" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: via serde_yaml_ng in toolspec (parses untrusted gavmo.yaml); replace with a maintained pure-Rust YAML parser" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 4: via keyring 3's zbus 4; fixed by moving secrets to keyring 4" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 3: via keyring 3's zbus 4; fixed by moving secrets to keyring 4" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 4: via keyring 3's zbus 4; fixed by moving secrets to keyring 4" },
]

# --- Licenses ---------------------------------------------------------------
# Permissive licenses only. A license may be listed only if some crate needs it.
[licenses]
confidence-threshold = 1.0
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # File-level copyleft, compatible with an MIT project as long as the crate
    # is used unmodified. Via dirs -> dirs-sys.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

# The workspace's own crates are checked too: each inherits `license = "MIT"`
# from the root Cargo.toml.
[licenses.private]
ignore = false

# --- Bans -------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies (`vm = { path = ... }`) aren't wildcards.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS is rustls-only (see reqwest's features in crates/gavmo/Cargo.toml).
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
    # keyring uses async-secret-service so no C libdbus is linked.
    { crate = "libdbus-sys", reason = "keyring must stay on async-secret-service (pure-Rust zbus)" },
    # Unmaintained (see [advisories]): only their current parents may use them.
    { crate = "paste", wrappers = ["either_of", "leptos", "reactive_graph", "reactive_stores", "tachys"], reason = "unmaintained, RUSTSEC-2024-0436" },
    { crate = "unsafe-libyaml", wrappers = ["serde_yaml_ng"], reason = "unmaintained, RUSTSEC-2024-0449" },
    { crate = "zbus_names", wrappers = ["zbus"], reason = "unmaintained, RUSTSEC-2026-0371" },
    { crate = "zvariant", wrappers = ["zbus", "zbus_names"], reason = "unmaintained, RUSTSEC-2026-0370" },
    { crate = "zvariant_derive", wrappers = ["zvariant"], reason = "unmaintained, RUSTSEC-2026-0372" },
]
# Duplicate versions that come from upstream, not from this repo. Each skips
# the older version; revisit on every dependency bump.
skip = [
    # rmcp moved to base64 0.23; axum, leptos, reqwest and secrets are on 0.22.
    { crate = "base64@0.22", reason = "upstream split: rmcp/hyper-util on 0.23" },
    # Two RustCrypto generations: chacha20poly1305 0.11 (secrets) is on the new
    # one; keyring's aes/cbc and sha1/sha2/hmac are on the old one.
    { crate = "block-buffer@0.10", reason = "RustCrypto generation split" },
    { crate = "cipher@0.4", reason = "RustCrypto generation split" },
    { crate = "cpufeatures@0.2", reason = "RustCrypto generation split" },
    { crate = "crypto-common@0.1", reason = "RustCrypto generation split" },
    { crate = "inout@0.1", reason = "RustCrypto generation split" },
    # zbus/secret-service (keyring 3) on rand 0.8, leptos on 0.9, rmcp on 0.10.
    { crate = "rand@0.8", reason = "keyring 3's zbus" },
    { crate = "rand@0.9", reason = "leptos" },
    { crate = "rand_core@0.6", reason = "keyring 3's zbus" },
    { crate = "rand_core@0.9", reason = "leptos" },
    { crate = "rand_chacha@0.3", reason = "keyring 3's zbus" },
    { crate = "getrandom@0.2", reason = "rand_core 0.6 and ring" },
    { crate = "getrandom@0.3", reason = "rand_core 0.9" },
    # The ecosystem is mid-move from syn 2 to syn 3.
    { crate = "syn@2", reason = "syn 2 -> 3 transition" },
    { crate = "thiserror@1", reason = "gloo-net (Leptos, wasm side)" },
    { crate = "thiserror-impl@1", reason = "gloo-net (Leptos, wasm side)" },
    { crate = "convert_case@0.6", reason = "config (leptos_config); Leptos macros are on 0.11" },
]

# Crates that run code at compile time. A new crate with a build script, or a
# script/executable shipped inside a compile-time crate, fails the check.
[bans.build]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true
include-archives = true
allow-build-scripts = [
    "anyhow",
    "async-io",
    "camino",
    "crossbeam-utils",
    "encoding_rs",
    "generic-array",
    "getrandom",
    "httparse",
    "icu_normalizer_data",
    "icu_properties_data",
    "leptos",
    "leptos_macro",
    "leptos_router",
    "libc",
    "libm",
    "memoffset",
    "mime_guess",
    "multer",
    "nix",
    "num-traits",
    "paste",
    "prettyplease",
    "proc-macro2",
    "proc-macro2-diagnostics",
    "qapi-qmp",
    "quote",
    "reactive_graph",
    "ref-cast",
    "ring",
    "rmcp",
    "rstml",
    "rustix",
    "rustls",
    "rustversion",
    "serde",
    "serde_core",
    "serde_json",
    "server_fn",
    "server_fn_macro",
    "slotmap",
    "tachys",
    "thiserror",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "zerocopy",
    "zmij",
]

