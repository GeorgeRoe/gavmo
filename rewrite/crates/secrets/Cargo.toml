[package]
name = "secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# AEAD for the vault file. Pure Rust; the 24-byte nonce is safe to generate
# randomly per write. Pinned exactly: crypto bumps must be deliberate.
chacha20poly1305 = "=0.11.0"
keystore.workspace = true
private_fs.workspace = true
# The vault's plaintext is a JSON map.
serde_json = "1"
thiserror.workspace = true
validated.workspace = true
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
keystore = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
# Exposes `MemoryStore`, an unencrypted in-process store for other crates'
# tests. Never enable outside dev-dependencies.
test-util = []
